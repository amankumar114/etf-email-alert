name: Aman's ETF Accumulation Alert

on:
  schedule:
    - cron: '30 4 * * *'   # 10:00 AM IST, runs daily
  workflow_dispatch:        # lets you trigger manually from the Actions tab

jobs:
  run-alert:
    runs-on: ubuntu-latest

    permissions:
      contents: write       # needed so git can push last_buy_dates.json back

    env:
      EMAIL:          ${{ secrets.EMAIL }}
      PASS:           ${{ secrets.PASS }}
      EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-yfinance-pandas-numpy
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install yfinance pandas numpy

      - name: Run ETF alert
        run: python alert_script.py

      - name: Persist buy dates
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add last_buy_dates.json
          git diff --staged --quiet || git commit -m "chore: update buy dates [skip ci]"
          git push
